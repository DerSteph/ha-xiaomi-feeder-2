feed:
  name: Feed Portions
  description: Dispenses a specified number of food portions (1–30).
  fields:
    device_id:
      name: Feeder
      description: The feeder(s) to use. Optional when only one feeder is set up.
      required: false
      selector:
        device:
          integration: xiaomi_feeder
          multiple: true
    portions:
      name: Portions
      description: Number of portions to dispense (1 to 30).
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 30
          mode: slider

calibrate_scale:
  name: Tare Bowl Scale
  description: Calibrates and zeroes out the load cell of the stainless steel food bowl.
  fields:
    device_id:
      name: Feeder
      description: The feeder(s) to use. Optional when only one feeder is set up.
      required: false
      selector:
        device:
          integration: xiaomi_feeder
          multiple: true

skip_next_meal:
  name: Skip Next Meal
  description: Temporarily suppresses the next scheduled hardware feeding without losing your master schedule.
  fields:
    device_id:
      name: Feeder
      description: The feeder(s) to use. Optional when only one feeder is set up.
      required: false
      selector:
        device:
          integration: xiaomi_feeder
          multiple: true
    count:
      name: Meals Count
      description: Number of upcoming scheduled meals to skip (default 1).
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 10
          mode: box
    enabled:
      name: Enabled
      description: Set to true to skip or false to resume normal schedule immediately.
      required: false
      default: true
      selector:
        boolean:

set_refill_reminder:
  name: Set Refill Reminder
  description: Configures the hopper refill reminder switch and cycle interval hours.
  fields:
    device_id:
      name: Feeder
      description: The feeder(s) to use. Optional when only one feeder is set up.
      required: false
      selector:
        device:
          integration: xiaomi_feeder
          multiple: true
    enabled:
      name: Enabled
      description: Whether the refill reminder is active.
      required: true
      selector:
        boolean:
    interval_hours:
      name: Interval Hours
      description: Reminder cycle duration in hours (1-24).
      required: false
      default: 6
      selector:
        number:
          min: 1
          max: 24
          mode: box

set_intake_alarm:
  name: Set Intake Alarm
  description: Configures abnormal low food intake alert threshold percentage.
  fields:
    device_id:
      name: Feeder
      description: The feeder(s) to use. Optional when only one feeder is set up.
      required: false
      selector:
        device:
          integration: xiaomi_feeder
          multiple: true
    enabled:
      name: Enabled
      description: Whether the low intake alarm is active.
      required: true
      selector:
        boolean:
    threshold_pct:
      name: Threshold Percentage
      description: Trigger alarm when intake is below this percentage of daily planned food.
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 100
          mode: box

clear_refill_alert:
  name: Clear Refill Alert
  description: Acknowledges and clears the active hopper refill reminder alert.
  fields:
    device_id:
      name: Feeder
      description: The feeder(s) to use. Optional when only one feeder is set up.
      required: false
      selector:
        device:
          integration: xiaomi_feeder
          multiple: true

clear_intake_alert:
  name: Clear Intake Alert
  description: Acknowledges and clears the active low food intake alert.
  fields:
    device_id:
      name: Feeder
      description: The feeder(s) to use. Optional when only one feeder is set up.
      required: false
      selector:
        device:
          integration: xiaomi_feeder
          multiple: true

clear_schedule:
  name: Clear Hardware Schedule
  description: Erases all offline scheduled meals from internal device EEPROM memory.
  fields:
    device_id:
      name: Feeder
      description: The feeder(s) to use. Optional when only one feeder is set up.
      required: false
      selector:
        device:
          integration: xiaomi_feeder
          multiple: true

start_fast_polling:
  name: Start Fast Weight Polling
  description: Polls the bowl weight every 10 s for a while, e.g. when a camera sees a cat at the bowl. Extends an already running fast window, never shortens it.
  fields:
    device_id:
      name: Feeder
      description: The feeder(s) to use. Optional when only one feeder is set up.
      required: false
      selector:
        device:
          integration: xiaomi_feeder
          multiple: true
    duration:
      name: Duration
      description: How long to poll fast, in seconds (10-3600). Activity at the bowl extends it.
      required: false
      default: 300
      selector:
        number:
          min: 10
          max: 3600
          unit_of_measurement: s
          mode: box
